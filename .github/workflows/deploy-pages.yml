name: Deploy Premium Landing to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/premium-landing-gsap-cbVh5
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build (base path = /Wrightclick/ for GitHub Pages)
        working-directory: app
        run: npm run build -- --base=/Wrightclick/

      - name: Deploy dist to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          branch: gh-pages
          clean: true
